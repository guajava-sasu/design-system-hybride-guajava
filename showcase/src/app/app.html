<a class="skip-link" href="#contenu" (click)="skipToContent($event)">Aller au contenu</a>

<header class="site-header doc-header">
  <div class="doc-header-start">
    <button
      class="doc-menu-toggle"
      type="button"
      aria-controls="doc-sidebar"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >
      <span class="doc-menu-icon" aria-hidden="true"><i></i><i></i><i></i></span>
      <span>Menu</span>
    </button>
    <a class="wordmark" routerLink="/">
      <span class="wordmark-mark" aria-hidden="true">A</span>
      <span>arcelor-mittal<span class="wordmark-dot" aria-hidden="true">.</span></span>
    </a>
  </div>
  <div class="header-actions">
    <button
      class="theme-toggle"
      type="button"
      [attr.aria-pressed]="theme() === 'dark'"
      [attr.aria-label]="theme() === 'dark' ? 'Activer le mode clair' : 'Activer le mode sombre'"
      (click)="toggleTheme()"
    >
      <span aria-hidden="true">◐</span><span>{{ theme() === 'dark' ? 'Mode clair' : 'Mode sombre' }}</span>
    </button>
    <a class="header-link" routerLink="/installation">Documentation <span aria-hidden="true">↗</span></a>
  </div>
</header>

<div class="doc-shell">
  @if (menuOpen()) {
    <button class="doc-backdrop" type="button" aria-label="Fermer le menu" (click)="closeMenu()"></button>
  }

  <aside class="doc-sidebar" id="doc-sidebar" [class.is-open]="menuOpen()">
    <nav aria-label="Navigation de la documentation">
      @for (group of navigation; track group.label) {
        <div class="doc-nav-group">
          <p class="doc-nav-title">{{ group.label }}</p>
          <ul class="doc-nav-list">
            @for (item of group.items; track item.path) {
              <li>
                <a
                  class="doc-nav-link"
                  [routerLink]="item.path"
                  routerLinkActive="is-active"
                  ariaCurrentWhenActive="page"
                  [routerLinkActiveOptions]="{ exact: true }"
                >{{ item.label }}</a>
              </li>
            }
          </ul>
        </div>
      }
    </nav>
  </aside>

  <div class="doc-main">
    <main id="contenu" tabindex="-1">
      <router-outlet />
    </main>

    <footer class="site-footer">
      <div class="am-container footer-content">
        <span>Un système commun. Des projets singuliers.</span>
        <span>Design system · v0.1</span>
      </div>
    </footer>
  </div>
</div>

<div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
